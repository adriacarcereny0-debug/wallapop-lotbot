# Genera la app de Mac («LOT Bot.app» dentro de un .dmg) en los servidores de
# GitHub, la PRUEBA tal y como la recibe el cliente y la publica para descargar.
#
# Descarga para clientes (enlaces fijos, siempre la última versión):
#   https://github.com/<usuario>/<repo>/releases/latest/download/LOT-Bot-macOS-arm64.dmg
#   https://github.com/<usuario>/<repo>/releases/latest/download/LOT-Bot-macOS-intel.dmg
#
# Las descargas se publican solo desde la rama «estable» (el canal de clientes).
#
# Firma y notarización de Apple (opcional): añade en Settings → Secrets → Actions
#   MACOS_CERT_P12_BASE64, MACOS_CERT_PASSWORD, MACOS_SIGN_IDENTITY,
#   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD
# Sin ellos la app se firma «ad hoc» y el cliente la abre la primera vez con
# clic derecho → Abrir.
name: App para Mac

on:
  workflow_dispatch:
  push:
    branches: ["main", "estable", "claude/**"]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15         # Apple Silicon (M1/M2/M3/M4)
            arch: arm64
          - runner: macos-15-intel   # Intel
            arch: intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Certificado de Apple (si está configurado)
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        if: env.MACOS_CERT_P12_BASE64 != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/firma.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

      - name: Compilar LOT Bot.app y el .dmg (incluye autoprueba)
        env:
          MAC_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          python3 -m pip install --upgrade pip
          ./build/build_macos.sh

      - name: Probar la app tal y como la recibe el cliente (desde el .dmg)
        run: |
          DMG="dist/LOT-Bot-macOS-${{ matrix.arch }}.dmg"
          test -f "$DMG"
          hdiutil attach "$DMG" -nobrowse -mountpoint /tmp/lotbot-dmg
          ls -la /tmp/lotbot-dmg
          test -L "/tmp/lotbot-dmg/Aplicaciones"
          # Igual que el cliente: copiar a Aplicaciones y abrir desde ahí
          rm -rf "/Applications/LOT Bot.app"
          cp -R "/tmp/lotbot-dmg/LOT Bot.app" /Applications/
          hdiutil detach /tmp/lotbot-dmg
          codesign --verify --deep --strict "/Applications/LOT Bot.app"
          plutil -p "/Applications/LOT Bot.app/Contents/Info.plist"
          "/Applications/LOT Bot.app/Contents/MacOS/LOT-Bot" --autoprueba

      - name: Pruebas automáticas del código
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          .venv-build/bin/python -m pip install -r requirements-dev.txt --quiet
          .venv-build/bin/python -m pytest -q

      - uses: actions/upload-artifact@v4
        with:
          name: LOT-Bot-macOS-${{ matrix.arch }}
          path: dist/LOT-Bot-macOS-${{ matrix.arch }}.dmg
          if-no-files-found: error

  publicar:
    # Solo si las dos versiones (chip Apple e Intel) se han compilado Y probado bien,
    # y solo desde el canal «estable» (o una etiqueta v*): lo que se sube a las
    # demás ramas se compila y se prueba, pero no llega a los clientes.
    needs: build
    if: github.ref == 'refs/heads/estable' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Versión
        id: version
        run: |
          VERSION=$(python3 -c "import re;print(re.search(r'__version__ = \"(.+?)\"', open('lot_bot/__init__.py').read()).group(1))")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          ls -la dist

      - name: Publicar la descarga para clientes
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: LOT Bot ${{ steps.version.outputs.version }} para Mac
          make_latest: true
          files: |
            dist/LOT-Bot-macOS-arm64.dmg
            dist/LOT-Bot-macOS-intel.dmg
          body: |
            ## Descargar LOT Bot para Mac

            | Tu Mac | Descarga |
            |---|---|
            | Chip Apple (M1, M2, M3, M4) | **LOT-Bot-macOS-arm64.dmg** |
            | Procesador Intel | **LOT-Bot-macOS-intel.dmg** |

            ¿No sabes cuál es? Menú  → **Acerca de este Mac** → «Chip» o «Procesador».

            ### Instalar
            1. Abre el `.dmg` y arrastra **LOT Bot** a **Aplicaciones**.
            2. La primera vez: en Aplicaciones, **clic derecho sobre LOT Bot → Abrir → Abrir**.
               En macOS 15 o posterior, si no aparece «Abrir»: Ajustes del Sistema →
               Privacidad y seguridad → **Abrir igualmente**.
            3. Necesitas **Google Chrome** o **Microsoft Edge** instalado: el bot lo usa para publicar en Wallapop.

            Requisitos: macOS 11 o posterior.

            Versión compilada y probada automáticamente en Mac (chip Apple e Intel):
            la app arranca, abre Chrome y el bot lo controla correctamente.
